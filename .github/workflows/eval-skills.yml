name: Eval skill changes

# docs/decisions/0043-eval-harness-for-shipped-skill-changes.md,
# docs/decisions/0044-eval-harness-ci-safety-gates.md.
#
# Never `pull_request_target` — that trigger exposes secrets to fork-originated PRs. Plain
# `pull_request` already withholds secrets from forks; the `fork-guard` job condition below goes
# further and skips the autonomous Kilo run against fork content entirely, secrets or not.

on:
  pull_request:
    types: [opened]
    branches: [master]
    paths:
      - "plugins/kms/skills/**"
      - "plugins/kms/shared/**"
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    name: eval (${{ matrix.case }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: [bootstrap, roadmap, capture, lint, attribute]
    env:
      PROMPTFOO_API_KEY: ${{ secrets.PROMPTFOO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install -g @kilocode/cli
      - uses: promptfoo/promptfoo-action@v1
        with:
          github-token: ${{ github.token }}
          config: evals/${{ matrix.case }}/promptfooconfig.yaml
          promptfoo-version: "0.122.2"
          # Its own PR comment names neither which matrix case it's about, nor a working
          # results link without a share (see the amendment on docs/decisions/0044-...). 5
          # cases means 5 near-identical, unhelpful comments. Disabled; the eval-summary job
          # below posts one consolidated comment for the whole run instead.
          disable-comment: true
      # Upload the full result even (especially) when the eval step above failed — a grading
      # failure is unrecoverable from the log alone, since the printed table truncates the
      # transcript. promptfoo-action reads its own -o output file and unconditionally unlinks it before
      # this step ever runs (confirmed by reading the action's own source, dist/index.js) — so
      # nothing survives to upload from that file. `promptfoo export eval latest` re-reads the
      # same eval from promptfoo's persistent local store (~/.promptfoo) instead, which the
      # action doesn't touch.
      - if: always()
        run: npx promptfoo@0.122.2 export eval latest -o eval-result-${{ matrix.case }}.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ matrix.case }}
          path: eval-result-${{ matrix.case }}.json
          retention-days: 14
          if-no-files-found: warn

  eval-summary:
    name: eval summary
    needs: eval
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    env:
      PROMPTFOO_API_KEY: ${{ secrets.PROMPTFOO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-results-*
          path: results
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 evals/providers/post-eval-summary.py results
          ${{ github.event.pull_request.number }}
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  eval-recheck-fork-check:
    name: eval-recheck (fork check)
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/eval') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      is_fork: ${{ steps.fork-check.outputs.is_fork }}
    steps:
      # `issue_comment` payloads carry no `head.repo.fork` field the way `pull_request` payloads
      # do — a collaborator commenting `/eval` on someone else's fork-originated PR would
      # otherwise still trigger a run against that fork's content. Resolve fork status via the
      # API before anything else in the re-run path runs.
      - id: fork-check
        run: echo "is_fork=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json isCrossRepository -q .isCrossRepository)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  eval-recheck:
    name: eval-recheck (${{ matrix.case }})
    needs: eval-recheck-fork-check
    if: needs.eval-recheck-fork-check.outputs.is_fork == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: [bootstrap, roadmap, capture, lint, attribute]
    env:
      PROMPTFOO_API_KEY: ${{ secrets.PROMPTFOO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install -g @kilocode/cli
      - uses: promptfoo/promptfoo-action@v1
        with:
          github-token: ${{ github.token }}
          config: evals/${{ matrix.case }}/promptfooconfig.yaml
          promptfoo-version: "0.122.2"
          disable-comment: true
      - if: always()
        run: npx promptfoo@0.122.2 export eval latest -o eval-result-${{ matrix.case }}.json || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-recheck-results-${{ matrix.case }}
          path: eval-result-${{ matrix.case }}.json
          retention-days: 14
          if-no-files-found: warn

  eval-recheck-summary:
    name: eval-recheck summary
    needs: [eval-recheck-fork-check, eval-recheck]
    if: always() && needs.eval-recheck-fork-check.outputs.is_fork == 'false'
    runs-on: ubuntu-latest
    env:
      PROMPTFOO_API_KEY: ${{ secrets.PROMPTFOO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-recheck-results-*
          path: results
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 evals/providers/post-eval-summary.py results
          ${{ github.event.issue.number }}
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
