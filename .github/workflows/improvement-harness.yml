name: Improvement Harness

# Runs the improvement harness on a schedule and on manual dispatch.
# Phase 0.2: Add OpenCode to GitHub Actions setup (CI prerequisite)

on:
  schedule:
    - cron: "0 2 * * *"  # Daily at 2 AM UTC (matches improvement.yaml scheduled cron)
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        options: [scheduled, manual]
        default: scheduled
      dry_run:
        description: Dry run (no commits)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  improvement-harness:
    name: Run improvement harness
    if: github.repository == 'vivantel/kms'  # Only run on main repo, not forks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASELINE_REF: "latest-tag"
      DRY_RUN: "${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}"
      FALLBACK_MODEL: "openrouter/~anthropic/claude-haiku-latest"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git worktree

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .opencode/package-lock.json

      - name: Install OpenCode CLI
        run: |
          npm install -g @opencode/cli@latest

      - name: Install dependencies
        run: npm ci
        working-directory: .opencode

      - name: Install Kilo Code CLI (for evals)
        run: npm install -g @kilocode/cli

      - name: Run improvement harness
        run: |
          MODE="${{ github.event.inputs.mode || 'scheduled' }}"
          if [[ "$MODE" == "scheduled" && "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="manual"
          fi
          CHANGED_FILES=""
          if [[ "${{ github.event_name }}" == "push" ]]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | tr '\n' ',' | sed 's/,$//')
          fi
          bash plugins/kms/hooks/improvement-runner.sh "$MODE" "$CHANGED_FILES"
        env:
          PROMPTFOO_API_KEY: ${{ secrets.PROMPTFOO_API_KEY }}

      - name: Verify auto-commits (CI gate)
        if: success() && env.DRY_RUN != 'true'
        run: |
          # Phase 4.3: CI verification gate
          # Verify that any commits made by the harness pass our quality gates
          echo "Checking recent commits from improvement harness..."
          RECENT_COMMITS=$(git log --oneline -10 --author="kms-improvement-bot" --grep="improvement" || true)
          if [[ -z "$RECENT_COMMITS" ]]; then
            echo "No improvement harness commits found in recent history"
            exit 0
          fi
          
          echo "Found improvement harness commits:"
          echo "$RECENT_COMMITS"
          
          # 1. Verify commit format: Conventional Commits + Refs trailers
          echo "Verifying commit message format..."
          for commit in $(echo "$RECENT_COMMITS" | awk '{print $1}'); do
            msg=$(git log -1 --format="%B" "$commit")
            # Check Conventional Commits format
            if ! echo "$msg" | head -1 | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\(.+\))?: .+'; then
              echo "::error::Commit $commit: Invalid Conventional Commits format"
              echo "Message: $msg"
              exit 1
            fi
            # Check Refs trailer
            if ! echo "$msg" | grep -q '^Refs: '; then
              echo "::error::Commit $commit: Missing Refs trailer"
              echo "Message: $msg"
              exit 1
            fi
            # Verify Refs point to existing files
            refs=$(echo "$msg" | grep '^Refs: ' | sed 's/^Refs: //')
            for ref in $(echo "$refs" | tr ',' '\n'); do
              ref=$(echo "$ref" | xargs)
              if [[ ! -f "$ref" ]]; then
                echo "::warning::Commit $commit: Refs points to non-existent file: $ref"
              fi
            done
          done
          echo "Commit format verification passed"
          
          # 2. Verify file scope: only expected paths modified
          echo "Verifying file scope..."
          CHANGED_FILES_ALL=$(git diff --name-only HEAD~$(echo "$RECENT_COMMITS" | wc -l) HEAD)
          for f in $CHANGED_FILES_ALL; do
            if [[ ! "$f" =~ ^(plugins/kms/skills/|plugins/kms/shared/|docs/|.opencode/agent/improve/|.github/workflows/) ]]; then
              echo "::warning::Unexpected file modified by harness: $f"
            fi
          done
          echo "File scope verification passed"
          
          # 3. Run lint on the whole repo to ensure no regressions
          echo "Running lint gate..."
          if ! opencode run --agent lint "lint the knowledge base" --print-logs; then
            echo "::error::Lint gate failed - harness commits introduced violations"
            exit 1
          fi
          echo "Lint gate passed"
          
          # 4. If any skill-rewrite commits, verify eval gates
          echo "Checking for skill-rewrite commits requiring eval verification..."
          SKILL_REWRITE_COMMITS=$(git log --oneline -10 --author="kms-improvement-bot" --grep="skill-rewrite" || true)
          if [[ -n "$SKILL_REWRITE_COMMITS" ]]; then
            echo "Found skill-rewrite commits, running eval verification..."
            for commit in $(echo "$SKILL_REWRITE_COMMITS" | awk '{print $1}'); do
              # Extract skill name from commit message or changed files
              skill_files=$(git diff --name-only "$commit^..$commit" | grep 'plugins/kms/skills/' | head -1)
              if [[ -n "$skill_files" ]]; then
                skill_dir=$(dirname "$skill_files")
                skill_name=$(basename "$skill_dir")
                if [[ -d "evals/$skill_name" ]]; then
                  echo "Running eval for $skill_name..."
                  if ! promptfoo eval -c "evals/$skill_name/promptfooconfig.yaml" -o json; then
                    echo "::error::Eval gate failed for $skill_name"
                    exit 1
                  fi
                fi
              fi
            done
            echo "Eval gate passed"
          fi
          
          echo "All CI verification gates passed"

      - name: Update improvement log (if commits made)
        if: success() && env.DRY_RUN != 'true'
        run: |
          # Base64-encoded Python script to append log entry
          # This avoids YAML parsing issues with colon-lines in the workflow
          LOG_SCRIPT_B64=""
          RUN_DATE=$(date -Iseconds)
          RUN_MODE="${{ github.event.inputs.mode || github.event_name }}"
          COMMIT_COUNT=$(git log --oneline -10 --author="kms-improvement-bot" --grep="improvement" | wc -l | tr -d ' ')
          
          if [[ "$COMMIT_COUNT" -gt 0 ]]; then
            echo "$LOG_SCRIPT_B64" | base64 -d | python3 - "$RUN_DATE" "$RUN_MODE" "$GITHUB_RUN_NUMBER" "${BASELINE_REF}" "$COMMIT_COUNT" "$GITHUB_RUN_ID"
            git config user.name "kms-improvement-bot"
            git config user.email "kms-improvement@vivantel.dev"
            git add docs/improvement-log.md
            git commit -m "docs: update improvement log for run $GITHUB_RUN_NUMBER" -m "Refs: docs/improvement-log.md"
            git push
          fi