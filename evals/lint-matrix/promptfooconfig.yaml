description: "kms lint matrix: clean control plus one seeded violation per check"
prompts:
  - >
    Lint the knowledge base. After completing your analysis, end your response with exactly one line, `LINT_FINDINGS:` followed by the comma-separated numbers of every lint check (1-24) for which you found at least one violation, or `NONE` if the knowledge base has no violations. Report only what you verified.
providers:
  - id: "exec:../providers/kilo-runner.sh"
    config:
      model: "cohere/north-mini-code:free"
      timeout_seconds: 1440
