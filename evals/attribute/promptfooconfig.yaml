# Eval case: `attribute` — docs/decisions/0043-eval-harness-for-shipped-skill-changes.md.
# The control case: `attribute` and this fixture are deliberately never touched between runs,
# so a regression here means the harness itself broke, not the skill.
# Run standalone: npx promptfoo eval -c evals/attribute/promptfooconfig.yaml
description: "kms attribute — commit message with a Refs: trailer and Conventional Commits type"

prompts:
  - "Commit this with attribution."

providers:
  - id: "exec:../providers/kilo-runner.sh"
    config:
      fixture_dir: "evals/attribute/fixture"
      model: "cohere/north-mini-code:free"
      timeout_seconds: 480

defaultTest:
  assert:
    - type: regex
      value: "(^|\\n)(feat|fix|docs|style|refactor|perf|test|build|ci|chore): \\S.+"
    - type: regex
      value: "Refs: docs/decisions/0001-cap-retry-backoff\\.md"
    # The commit must actually exist: the newest subject in the runner's git-log section is a
    # new one, not the fixture's last base commit, and carries a Conventional Commits prefix.
    - type: javascript
      value: |
        const m = output.split('=== RECENT GIT LOG (subject lines) ===')[1] || '';
        const first = m.trim().split('\n')[0] || '';
        return first !== 'feat: add retry-with-backoff client helper'
          && /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\(.+\))?: \S/.test(first);
    # The trailer must be in the commit itself, not only in the transcript.
    - type: javascript
      value: |
        const body = (output.split('=== LAST COMMIT BODY ===')[1] || '');
        return /Refs: docs\/decisions\/0001-cap-retry-backoff\.md/.test(body);
