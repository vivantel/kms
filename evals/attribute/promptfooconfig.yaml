# Eval case: `attribute` — docs/decisions/0043-eval-harness-for-shipped-skill-changes.md.
# The control case: `attribute` and this fixture are deliberately never touched between runs,
# so a regression here means the harness itself broke, not the skill.
# Run standalone: npx promptfoo eval -c evals/attribute/promptfooconfig.yaml
description: "kms attribute — commit message with a Refs: trailer and Conventional Commits type"

prompts:
  - "Commit this with attribution."

providers:
  - id: "exec:../providers/kilo-runner.sh"
    config:
      fixture_dir: "evals/attribute/fixture"
      model: "poolside/laguna-s-2.1:free"
      timeout_seconds: 480

defaultTest:
  assert:
    - type: regex
      value: "(^|\\n)(feat|fix|docs|style|refactor|perf|test|build|ci|chore): \\S.+"
    - type: regex
      value: "Refs: docs/decisions/0001-cap-retry-backoff\\.md"
