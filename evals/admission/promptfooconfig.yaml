# Generated by build.py; do not edit. Run: npx promptfoo eval -c evals/admission/promptfooconfig.yaml --repeat 5 -o out.json
# Score: python3 evals/admission/score.py out.json
description: "kms admission: does the agent record only changes that pass the admission test"
prompts:
  - >
    A work session just ended. One change came out of it: {{case}} Run the first check of the `capture` skill on this change only. Apply the Admission section of the artifact model, and do not create or edit any file. End your response with exactly one line, `ADMISSION:` followed by the record this change would become: one of none, fact, decision, guardrail, procedure.
providers:
  - id: "exec:../providers/kilo-runner.sh"
    config:
      fixture_dir: "evals/admission/fixture"
      model: "nvidia/nvidia/nemotron-3.5-lightning-30b-a3b"
      timeout_seconds: 480
defaultTest:
  assert:
    - type: regex
      value: "ADMISSION:[ \\t]*`?(none|fact|decision|guardrail|procedure)`?[ \\t.]*$"
